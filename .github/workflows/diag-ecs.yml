name: Diag ECS

on:
  workflow_dispatch:

jobs:
  diag:
    name: Diagnose ECS
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/ecs_key
          chmod 600 ~/.ssh/ecs_key
          ssh-keyscan -p ${{ secrets.ECS_PORT || 22 }} ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run diagnostics
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER || 'root' }}
          ECS_PORT: ${{ secrets.ECS_PORT || 22 }}
        run: |
          SSH="ssh -i ~/.ssh/ecs_key -p $ECS_PORT $ECS_USER@$ECS_HOST"

          echo "=== 1. Nginx Status ==="
          $SSH "systemctl status nginx --no-pager -l 2>/dev/null || echo 'Nginx not found'"

          echo ""
          echo "=== 2. Download Directory ==="
          $SSH "ls -lah /var/www/enlyai.com/downloads/duix/ 2>/dev/null || echo 'Directory not found'"

          echo ""
          echo "=== 3. APK Files ==="
          $SSH "find /var/www/enlyai.com/downloads/duix/ -name '*.apk' -exec ls -lh {} \;"

          echo ""
          echo "=== 4. version.json ==="
          $SSH "cat /var/www/enlyai.com/downloads/duix/version.json 2>/dev/null || echo 'Not found'"

          echo ""
          echo "=== 5. Disk Space ==="
          $SSH "df -h /"

          echo ""
          echo "=== 6. Download URL Test ==="
          $SSH "curl -sI http://localhost/downloads/duix/duix_digital_human.apk | head -5"
