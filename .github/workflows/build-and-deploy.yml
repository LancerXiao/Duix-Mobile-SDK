name: Build & Deploy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake and NDK
        run: |
          yes | sdkmanager --install "platforms;android-35"
          yes | sdkmanager --install "cmake;3.18.1"
          yes | sdkmanager --install "ndk;25.2.9519653"
          yes | sdkmanager --licenses

      - name: Decode keystore
        working-directory: duix-android/dh_aigc_android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > demo.jks
          cp demo.jks test/demo.jks

      - name: Configure local.properties
        working-directory: duix-android/dh_aigc_android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "duix.keystore.file=demo.jks" >> local.properties
          echo "duix.keystore.password=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "duix.keystore.alias=demo" >> local.properties
          echo "duix.keystore.alias.password=${{ secrets.KEY_ALIAS_PASSWORD }}" >> local.properties

      - name: Grant execute permission for gradlew
        working-directory: duix-android/dh_aigc_android
        run: chmod +x gradlew

      - name: Debug - List TTS service files
        run: find duix-android/dh_aigc_android/test/src/main/java -name "*TtsService.kt" -type f

      - name: Bump version
        id: bump_version
        working-directory: duix-android/dh_aigc_android
        run: |
          # Read current version
          CURRENT_CODE=$(grep "versionCode" test/build.gradle | head -1 | sed 's/.*versionCode *\([0-9]*\).*/\1/')
          NEW_CODE=$((CURRENT_CODE + 1))

          # Get current date for version name
          DATE_SUFFIX=$(date -u +%Y%m%d)
          CURRENT_NAME=$(grep "versionName" test/build.gradle | head -1 | sed "s/.*versionName *'\([^']*\)'.*/\1/")
          # Extract base version (e.g., "4.1" from "4.1.1")
          BASE_VERSION=$(echo "$CURRENT_NAME" | sed 's/\([0-9]*\.[0-9]*\).*/\1/')
          NEW_NAME="${BASE_VERSION}.${NEW_CODE}"

          # Update build.gradle
          sed -i "s/versionCode ${CURRENT_CODE}/versionCode ${NEW_CODE}/" test/build.gradle
          sed -i "s/versionName '${CURRENT_NAME}'/versionName '${NEW_NAME}'/" test/build.gradle

          echo "Version: ${CURRENT_NAME} (${CURRENT_CODE}) -> ${NEW_NAME} (${NEW_CODE})"
          echo "code=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "name=${NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: duix-android/dh_aigc_android
        run: ./gradlew :test:assembleRelease --no-daemon --rerun-tasks

      - name: Extract version info
        id: version
        working-directory: duix-android/dh_aigc_android
        run: |
          VERSION_NAME="${{ steps.bump_version.outputs.name }}"
          VERSION_CODE="${{ steps.bump_version.outputs.code }}"
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          APK_FILE=$(find test/build/outputs/apk/release -name '*.apk' | head -1)
          # Convert to absolute path from repo root
          APK_ABS="$GITHUB_WORKSPACE/duix-android/dh_aigc_android/$APK_FILE"
          echo "apk=$APK_ABS" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "APK: $APK_ABS"

      - name: Generate version.json
        run: |
          cat > version.json << EOF
          {
            "version_code": ${{ steps.version.outputs.code }},
            "version_name": "${{ steps.version.outputs.name }}",
            "download_url": "https://www.enlyai.com/downloads/duix/duix_digital_human.apk",
            "update_message": "DUIX Digital Human 新版本可用，点击下载更新",
            "force_update": false,
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.ECS_PORT }} ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to ECS
        run: |
          DEPLOY_DIR="/var/www/enlyai.com/downloads/duix"
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.ECS_PORT }} ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "mkdir -p $DEPLOY_DIR"
          scp -i ~/.ssh/deploy_key -P ${{ secrets.ECS_PORT }} ${{ steps.version.outputs.apk }} ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:$DEPLOY_DIR/duix_digital_human.apk
          scp -i ~/.ssh/deploy_key -P ${{ secrets.ECS_PORT }} version.json ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:$DEPLOY_DIR/version.json
          scp -i ~/.ssh/deploy_key -P ${{ secrets.ECS_PORT }} deploy/download-page.html ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:$DEPLOY_DIR/index.html
          echo "Deployed to: https://www.enlyai.com/downloads/duix/"

      - name: Commit version bump
        working-directory: duix-android/dh_aigc_android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/build.gradle
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.bump_version.outputs.name }} (${{ steps.bump_version.outputs.code }})"
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duix-release-apk
          path: ${{ steps.version.outputs.apk }}
          retention-days: 30
