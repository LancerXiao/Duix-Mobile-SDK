name: Build & Deploy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake and NDK
        run: |
          yes | sdkmanager --install "platforms;android-35"
          yes | sdkmanager --install "cmake;3.18.1"
          yes | sdkmanager --install "ndk;25.2.9519653"
          yes | sdkmanager --licenses

      - name: Decode keystore
        working-directory: duix-android/dh_aigc_android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > demo.jks
          cp demo.jks test/demo.jks

      - name: Configure local.properties
        working-directory: duix-android/dh_aigc_android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "duix.keystore.file=demo.jks" >> local.properties
          echo "duix.keystore.password=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "duix.keystore.alias=demo" >> local.properties
          echo "duix.keystore.alias.password=${{ secrets.KEY_ALIAS_PASSWORD }}" >> local.properties

      - name: Grant execute permission for gradlew
        working-directory: duix-android/dh_aigc_android
        run: chmod +x gradlew

      - name: Bump version
        id: bump_version
        working-directory: duix-android/dh_aigc_android
        run: |
          # Read current version
          CURRENT_CODE=$(grep "versionCode" test/build.gradle | head -1 | sed 's/.*versionCode *\([0-9]*\).*/\1/')
          NEW_CODE=$((CURRENT_CODE + 1))

          # Get current date for version name
          DATE_SUFFIX=$(date -u +%Y%m%d)
          CURRENT_NAME=$(grep "versionName" test/build.gradle | head -1 | sed "s/.*versionName *'\([^']*\)'.*/\1/")
          # Extract base version (e.g., "4.1" from "4.1.1")
          BASE_VERSION=$(echo "$CURRENT_NAME" | sed 's/\([0-9]*\.[0-9]*\).*/\1/')
          NEW_NAME="${BASE_VERSION}.${NEW_CODE}"

          # Update build.gradle
          sed -i "s/versionCode ${CURRENT_CODE}/versionCode ${NEW_CODE}/" test/build.gradle
          sed -i "s/versionName '${CURRENT_NAME}'/versionName '${NEW_NAME}'/" test/build.gradle

          echo "Version: ${CURRENT_NAME} (${CURRENT_CODE}) -> ${NEW_NAME} (${NEW_CODE})"
          echo "code=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "name=${NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: duix-android/dh_aigc_android
        run: ./gradlew :test:clean :test:assembleRelease --no-daemon

      - name: Extract version info
        id: version
        working-directory: duix-android/dh_aigc_android
        run: |
          VERSION_NAME="${{ steps.bump_version.outputs.name }}"
          VERSION_CODE="${{ steps.bump_version.outputs.code }}"
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          APK_FILE=$(find test/build/outputs/apk/release -name '*.apk' | head -1)
          # Convert to absolute path from repo root
          APK_ABS="$GITHUB_WORKSPACE/duix-android/dh_aigc_android/$APK_FILE"
          echo "apk=$APK_ABS" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "APK: $APK_ABS"

      - name: Generate version.json
        run: |
          cat > version.json << EOF
          {
            "version_code": ${{ steps.version.outputs.code }},
            "version_name": "${{ steps.version.outputs.name }}",
            "download_url": "https://www.enlyai.com/downloads/duix/duix_digital_human.apk",
            "update_message": "DUIX Digital Human 新版本可用，点击下载更新",
            "force_update": false,
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.ECS_PORT }} ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to ECS
        run: |
          DEPLOY_DIR="/var/www/enlyai.com/downloads/duix"
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.ECS_PORT }} ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "mkdir -p $DEPLOY_DIR"
          scp -i ~/.ssh/deploy_key -P ${{ secrets.ECS_PORT }} ${{ steps.version.outputs.apk }} ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:$DEPLOY_DIR/duix_digital_human.apk
          scp -i ~/.ssh/deploy_key -P ${{ secrets.ECS_PORT }} version.json ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:$DEPLOY_DIR/version.json
          scp -i ~/.ssh/deploy_key -P ${{ secrets.ECS_PORT }} deploy/download-page.html ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:$DEPLOY_DIR/index.html

          # Configure nginx to serve /downloads/ as static files
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.ECS_PORT }} ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "bash -s" << 'NGINX_SETUP'
          set -e

          echo "=== Verifying deployed files ==="
          ls -la /var/www/enlyai.com/downloads/duix/
          chmod -R 755 /var/www/enlyai.com/downloads/

          echo "=== Nginx config files ==="
          find /etc/nginx -name "*.conf" -type f 2>/dev/null

          # Find the HTTPS server config for enlyai.com
          MAIN_CONF=""
          for dir in /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ /etc/nginx/sites-available/; do
            if [ -d "$dir" ]; then
              for f in "$dir"*.conf "$dir"*; do
                [ -f "$f" ] || continue
                if grep -q "server_name.*enlyai" "$f" 2>/dev/null && grep -q "listen.*443" "$f" 2>/dev/null; then
                  MAIN_CONF="$f"
                  break 2
                fi
              done
            fi
          done

          # Fallback: any config with server_name enlyai
          if [ -z "$MAIN_CONF" ]; then
            for dir in /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ /etc/nginx/sites-available/; do
              if [ -d "$dir" ]; then
                MAIN_CONF=$(grep -rl "server_name.*enlyai" "$dir" 2>/dev/null | head -1)
                [ -n "$MAIN_CONF" ] && break
              fi
            done
          fi

          # Last fallback: any config with listen 443
          if [ -z "$MAIN_CONF" ]; then
            for dir in /etc/nginx/sites-enabled/ /etc/nginx/conf.d/; do
              if [ -d "$dir" ]; then
                MAIN_CONF=$(grep -rl "listen.*443" "$dir" 2>/dev/null | head -1)
                [ -n "$MAIN_CONF" ] && break
              fi
            done
          fi

          if [ -z "$MAIN_CONF" ]; then
            echo "ERROR: Could not find nginx server config for enlyai.com"
            echo "=== Full nginx config ==="
            nginx -T 2>&1 | head -100
            exit 1
          fi

          echo "Main config: $MAIN_CONF"
          echo "=== Current config ==="
          cat "$MAIN_CONF"
          echo ""
          echo "=== End of current config ==="

          # Remove any existing /downloads/ location blocks from previous attempts
          if grep -q "location /downloads/" "$MAIN_CONF" 2>/dev/null; then
            echo "Removing existing /downloads/ location block..."
            # Use perl to remove the location block (handles multi-line)
            perl -i -0pe 's/\n[[:space:]]*location\s+\/downloads\/\s*\{[^}]*\}//g' "$MAIN_CONF"
            echo "Removed existing /downloads/ location block"
          fi

          # Also clean up any broken downloads.conf from previous attempts
          rm -f /etc/nginx/conf.d/downloads.conf

          # Insert location block before the LAST closing brace in the file
          # The last } is typically the server block's closing brace
          awk '
          BEGIN { last_brace = 0; total = 0 }
          /^[[:space:]]*}[[:space:]]*$/ { last_brace = NR }
          { lines[NR] = $0; total = NR }
          END {
            for (i = 1; i <= total; i++) {
              if (i == last_brace) {
                print "    location /downloads/ {"
                print "        alias /var/www/enlyai.com/downloads/;"
                print "        autoindex off;"
                print "    }"
                print ""
              }
              print lines[i]
            }
          }' "$MAIN_CONF" > "${MAIN_CONF}.tmp" && mv "${MAIN_CONF}.tmp" "$MAIN_CONF"

          echo "Added /downloads/ location block before last closing brace"
          echo "=== Updated config ==="
          cat "$MAIN_CONF"
          echo ""
          echo "=== End of updated config ==="

          # Test nginx config
          echo "Testing nginx config..."
          nginx -t 2>&1

          # Reload nginx
          echo "Reloading nginx..."
          nginx -s reload 2>&1
          echo "nginx reloaded successfully"

          # Verify deployment works
          echo "Verifying deployment..."
          sleep 2
          RESPONSE=$(curl -sI "http://localhost/downloads/duix/version.json" 2>&1 | head -5)
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -qi "application/json\|text/plain\|200 OK"; then
            echo "SUCCESS: /downloads/ is being served correctly"
          else
            echo "WARNING: /downloads/ may not be configured correctly"
            echo "Trying with 127.0.0.1 and Host header..."
            curl -sI -H "Host: enlyai.com" "http://127.0.0.1/downloads/duix/version.json" 2>&1 | head -5
          fi
          NGINX_SETUP
          echo "Deployed to: https://www.enlyai.com/downloads/duix/"

      - name: Commit version bump
        working-directory: duix-android/dh_aigc_android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/build.gradle
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.bump_version.outputs.name }} (${{ steps.bump_version.outputs.code }})"
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duix-release-apk
          path: ${{ steps.version.outputs.apk }}
          retention-days: 30
