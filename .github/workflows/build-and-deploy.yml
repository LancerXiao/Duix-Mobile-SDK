name: Build & Deploy APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_to_ecs:
        description: 'Deploy APK to ECS after build'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  ANDROID_SDK_VERSION: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  APK_DIR: duix-android/dh_aigc_android/test/build/outputs/apk/debug

jobs:
  # ── Preflight: verify secrets ──────────────────────────
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets
        run: |
          MISSING=0
          for SECRET_NAME in ECS_HOST ECS_USERNAME ECS_SSH_KEY ECS_SSH_PORT; do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "::error::Secret $SECRET_NAME is missing"
              MISSING=1
            else
              echo "::notice::Secret $SECRET_NAME is set"
            fi
          done
          exit $MISSING
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USERNAME: ${{ secrets.ECS_USERNAME }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT }}

  # ── Build: compile Android APK ─────────────────────────
  build:
    name: Build APK
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-${{ env.ANDROID_SDK_VERSION }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            duix-android/dh_aigc_android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('duix-android/dh_aigc_android/**/*.gradle*', 'duix-android/dh_aigc_android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create local.properties
        working-directory: duix-android/dh_aigc_android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        working-directory: duix-android/dh_aigc_android
        run: chmod +x gradlew || true

      - name: Build Debug APK
        working-directory: duix-android/dh_aigc_android
        run: |
          if [ -f gradlew ]; then
            ./gradlew :test:assembleDebug --no-daemon
          else
            gradle :test:assembleDebug --no-daemon
          fi

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          APK_NAME="DuixDigitalHuman_${VERSION}_${TIMESTAMP}_${SHORT_SHA}.apk"

          # Find the built APK
          APK_PATH=$(find ${{ env.APK_DIR }} -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found!"
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "/tmp/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_PATH=/tmp/$APK_NAME" >> $GITHUB_ENV
          echo "Built: $APK_NAME ($(du -h /tmp/$APK_NAME | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duix-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true

  # ── Deploy: SCP to ECS + update download page ──────────
  deploy:
    name: Deploy to ECS
    needs: build
    if: github.event.inputs.deploy_to_ecs != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: duix-apk
          path: /tmp/apk

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/ecs_key
          chmod 600 ~/.ssh/ecs_key
          ssh-keyscan -p ${{ secrets.ECS_SSH_PORT || 22 }} ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy APK to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USERNAME || 'root' }}
          ECS_PORT: ${{ secrets.ECS_SSH_PORT || 22 }}
        run: |
          APK_FILE=$(find /tmp/apk -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::APK not found in artifact"
            exit 1
          fi

          APK_BASENAME=$(basename "$APK_FILE")
          echo "Deploying: $APK_BASENAME"

          # Create download directory on ECS
          ssh -i ~/.ssh/ecs_key -p $ECS_PORT $ECS_USER@$ECS_HOST \
            "mkdir -p /var/www/html/download/duix"

          # Upload APK
          scp -i ~/.ssh/ecs_key -P $ECS_PORT "$APK_FILE" \
            $ECS_USER@$ECS_HOST:/var/www/html/download/duix/

          # Create latest symlink
          ssh -i ~/.ssh/ecs_key -p $ECS_PORT $ECS_USER@$ECS_HOST \
            "cd /var/www/html/download/duix && ln -sf $APK_BASENAME DuixDigitalHuman-latest.apk"

          echo "APK deployed to: http://$ECS_HOST/download/duix/$APK_BASENAME"
          echo "Latest APK: http://$ECS_HOST/download/duix/DuixDigitalHuman-latest.apk"

      - name: Update download page on ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USERNAME || 'root' }}
          ECS_PORT: ${{ secrets.ECS_SSH_PORT || 22 }}
        run: |
          # Upload the download page template
          scp -i ~/.ssh/ecs_key -P $ECS_PORT \
            deploy/download-page.html \
            $ECS_USER@$ECS_HOST:/var/www/html/download/duix/index.html

      - name: Verify deployment
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          sleep 3
          HTTP_CODE=$(curl -sI "http://$ECS_HOST/download/duix/DuixDigitalHuman-latest.apk" | head -1)
          echo "Download URL check: $HTTP_CODE"

          if echo "$HTTP_CODE" | grep -q "200\|302"; then
            echo "Deployment verified successfully!"
          else
            echo "::warning::Could not verify APK download URL"
          fi

  # ── Notify ──────────────────────────────────────────────
  notify:
    name: Notify
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          BUILD_RESULT="${{ needs.build.result }}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"

          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            echo "Build and deploy succeeded!"
          elif [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "skipped" ]; then
            echo "Build succeeded, deploy skipped."
          else
            echo "Build or deploy failed: build=$BUILD_RESULT deploy=$DEPLOY_RESULT"
          fi
